# =========================================================================
# DevSecOps Security Scanning
#   * Trivy   — scans built Docker images for known CVEs.
#   * pip-audit — audits Python dependencies for known vulnerabilities.
# Runs on push to main and on a weekly schedule.
# =========================================================================
name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC (cron: minute hour day month weekday).
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  # -----------------------------------------------------------------------
  # Trivy — vulnerability scan of the backend Docker image.
  # -----------------------------------------------------------------------
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cybergy-backend:scan ./backend
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cybergy-backend:scan
          format: table
          # Fail the job on CRITICAL/HIGH severity vulnerabilities.
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # -----------------------------------------------------------------------
  # pip-audit — dependency vulnerability audit for the backend.
  # -----------------------------------------------------------------------
  dependency-check:
    name: pip-audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt
